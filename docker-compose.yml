# LIVEPLAY — orquestación de referencia para producción / staging.
#
# Esta demo (construida en un sandbox sin daemon de Docker disponible) corrió Postgres,
# Redis y ambas apps como procesos nativos del sistema operativo. Este docker-compose es el
# camino recomendado para desplegar el proyecto real: agrupa Postgres, Redis, MinIO
# (almacenamiento S3-compatible auto-hospedado), el backend, el worker de video y el
# frontend. Ver /docs/ARCHITECTURE.md para el diseño completo y el plan de escalamiento.

version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ecp_user
      POSTGRES_PASSWORD: ecp_pass
      POSTGRES_DB: elcampito_play
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ecp_user']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    ports:
      - '9000:9000' # API S3
      - '9001:9001' # Consola web

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://ecp_user:ecp_pass@postgres:5432/elcampito_play
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?definir en .env}
      VIDEO_URL_SIGNING_SECRET: ${VIDEO_URL_SIGNING_SECRET:?definir en .env}
      STORAGE_PROVIDER: S3
      S3_BUCKET: elcampito-play
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      API_PUBLIC_URL: ${API_PUBLIC_URL:-http://localhost:3001}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-http://localhost:3000}
      CORS_ORIGINS: ${APP_PUBLIC_URL:-http://localhost:3000}
    ports:
      - '3001:3001'

  # Worker de procesamiento de video (FFmpeg -> HLS -> thumbnails) — proceso separado del API
  # para poder escalarlo de forma independiente (más réplicas / más CPU) según la carga de
  # ingesta de video, sin tocar la capa HTTP (§27/§28).
  video-worker:
    build: ./backend
    command: ['npm', 'run', 'worker']
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://ecp_user:ecp_pass@postgres:5432/elcampito_play
      REDIS_HOST: redis
      REDIS_PORT: 6379
      STORAGE_PROVIDER: S3
      S3_BUCKET: elcampito-play
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: ${API_PUBLIC_URL:-http://localhost:3001}
    ports:
      - '3000:3000'

volumes:
  postgres_data:
  minio_data:
